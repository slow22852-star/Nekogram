name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

    - name: Generate properties and patch build.gradle
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "sdk.dir=$ANDROID_HOME" > TMessagesProj/local.properties
        echo "sdk.dir=$ANDROID_HOME" > TMessagesProj_App/local.properties
        
        # Жестко вписываем версию в build.gradle (если он ищет переменную)
        sed -i 's/ext.TG_APP_VERSION_CODE = .*/ext.TG_APP_VERSION_CODE = 10/' TMessagesProj/build.gradle || true
        sed -i 's/ext.TG_APP_VERSION_NAME = .*/ext.TG_APP_VERSION_NAME = "10.0.0"/' TMessagesProj/build.gradle || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug -x lint -x test --no-daemon -Pandroid.disableNavigationResources=true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Nekogram-Debug-APK
        path: TMessagesProj/build/outputs/apk/debug/*.apk
