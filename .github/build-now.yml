name: Build APK Final

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

    - name: Patch Gradle and Generate Properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "sdk.dir=$ANDROID_HOME" > TMessagesProj/local.properties
        echo "sdk.dir=$ANDROID_HOME" > TMessagesProj_App/local.properties
        
        # Жестко вписываем версию в build.gradle прямо перед сборкой
        sed -i 's/versionCode.*/versionCode 10/g' TMessagesProj/build.gradle || true
        sed -i 's/versionName.*/versionName "10.0.0"/g' TMessagesProj/build.gradle || true
        
        echo "APP_VERSION_CODE=10" > TMessagesProj/version.properties
        echo "APP_VERSION_NAME=10.0.0" >> TMessagesProj/version.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug -x lint -x test --no-daemon -Pandroid.disableNavigationResources=true -PAPP_VERSION_CODE=10 -PAPP_VERSION_NAME=10.0.0

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Nekogram-Final-APK
        path: TMessagesProj/build/outputs/apk/debug/*.apk
